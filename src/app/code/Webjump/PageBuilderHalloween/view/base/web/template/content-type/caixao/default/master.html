<section class="noite-caixao" attr="data.main.attributes" css="data.main.css">
    <img class="noite-caixao__image" if="data.image.attributes().src" attr="data.image.attributes"/>
    <h2 class="noite-caixao__title" attr="data.titulo.attributes" html="data.titulo.html"></h2>
    <p class="noite-caixao__description" attr="data.descricao.attributes" html="data.descricao.html"></p>
    <a class="noite-caixao__button" if="data.link.attributes().href" attr="data.link.attributes">
        <span attr="data.button_text.attributes" html="data.button_text.html"></span>
    </a>
</section>
