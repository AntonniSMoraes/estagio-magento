<div class="pagebuilder-content-type" event="{ mouseover: onMouseOver, mouseout: onMouseOut }, mouseoverBubble: false">
    <render args="getOptions().template"></render>
    <section class="noite-caixao" attr="data.main.attributes" css="data.main.css">
        <scope args="getUploader().getUiComponent()"><render></render></scope>
        <img class="noite-caixao__image" if="data.image.attributes().src" attr="data.image.attributes"/>
        <h2 class="noite-caixao__title" attr="data.titulo.attributes" html="data.titulo.html"></h2>
        <p class="noite-caixao__description" attr="data.descricao.attributes" html="data.descricao.html"></p>
        <span class="noite-caixao__button" if="data.link.attributes().href" attr="data.button_text.attributes" html="data.button_text.html"></span>
    </section>
</div>
